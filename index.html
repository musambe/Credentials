<!DOCTYPE html>
<html>
<head>
<title>Order Verification</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:120px;
}

/* input box */
input{
    padding:10px;
    width:250px;
    font-size:16px;
}

/* button */
button{
    padding:10px 25px;
    margin-top:15px;
    background-color:purple;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

/* loading spinner */
.spinner{
    margin:20px auto;
    width:40px;
    height:40px;
    border:4px solid #eee;
    border-top:4px solid purple;
    border-radius:50%;
    animation: spin 1s linear infinite;
}

@keyframes spin{
    0%{ transform: rotate(0deg); }
    100%{ transform: rotate(360deg); }
}

</style>

<script>
function submitOrder(){

    var order = document.getElementById("order").value;

    if(order === ""){
        alert("Please enter your Mpesa Code");
        return;
    }

    document.getElementById("content").innerHTML =
    "<h3>Enter Correct Code</h3><div class='spinner'></div>";

}
</script>

</head>

<body>

<div id="content">
    
<h3>Follow Instructions on next page</h3>

<h3>Enter Mpesa Code to Unlock</h3>

<input type="text" id="order" placeholder="Mpesa Code">

<br>

<button onclick="submitOrder()">Submit</button>

</div>

</body>
</html>
